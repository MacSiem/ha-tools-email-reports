name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned test dependencies
        run: npm ci
      - name: Behavior, bundle parity and runtime tests
        run: npm test
      - name: Python persistence tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Deterministic bundle gate
        run: node scripts/build-bundle.mjs --check
      - name: Repository hygiene
        run: |
          if git ls-files 'codex-runs/**' | grep -q .; then
            echo "FAIL: tracked agent-run artifact"
            git ls-files 'codex-runs/**'
            exit 1
          fi
      - name: JS syntax (node --check)
        run: |
          fail=0
          for f in $(git ls-files '*.js'); do
            node --check "$f" || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail
      - name: Theming invariant (no OS prefers-color-scheme)
        run: |
          if grep -rln "@media (prefers-color-scheme" --include='*.js' .; then
            echo "FAIL: OS prefers-color-scheme present — cards must follow HA theme via :host(.bento-dark) luminance"
            exit 1
          fi
          echo "OK: no OS prefers-color-scheme"
      - name: A11y invariant (focus-visible present in cards)
        run: |
          miss=0
          for f in $(git ls-files '*.js' | grep -vE 'editor|\.min\.'); do
            if grep -q 'customElements.define' "$f" && grep -q ':host' "$f"; then
              grep -q ':focus-visible' "$f" || { echo "FAIL: no :focus-visible in $f"; miss=1; }
            fi
          done
          exit $miss
