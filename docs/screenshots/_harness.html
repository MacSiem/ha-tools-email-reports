<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Log Email screenshot harness</title>
<style>
  html, body { margin: 0; padding: 24px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body.light { background: #f4f5f7; }
  body.light ha-log-email { --card-background-color: #ffffff; --primary-background-color: #f4f5f7; }
  body.dark { background: #111318; }
  body.dark ha-log-email { --card-background-color: #1c1e26; --primary-background-color: #111318; }
  ha-log-email { display: block; width: 480px; }
</style>
</head>
<body>
<ha-log-email id="card"></ha-log-email>
<script src="../../ha-log-email.js"></script>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') === 'dark' ? 'dark' : 'light';
  document.body.className = theme;
  const now = Date.now();
  const states = {
    'automation.ha_tools_log_email_daily': { entity_id: 'automation.ha_tools_log_email_daily', state: 'on', attributes: {} },
    'automation.ha_tools_log_email_weekly': { entity_id: 'automation.ha_tools_log_email_weekly', state: 'off', attributes: {} },
  };
  const hass = {
    language: 'en', themes: { darkMode: theme === 'dark' }, user: { is_admin: true }, states,
    services: { ha_tools_email: { send: {}, test: {}, get_config: {} } },
    connection: { subscribeEvents: () => Promise.resolve(() => {}) },
    callWS: async ({type}) => type === 'system_log/list' ? [
      { level: 'WARNING', name: 'demo.integration', message: ['Sample warning from a test integration'], timestamp: now / 1000 - 600, count: 1 },
    ] : [],
    callService: async (_domain, service) => service === 'get_config' ? { response: { default_recipient: 'demo@example.com' } } : {},
  };
  const card = document.getElementById('card');
  card.setConfig({ type: 'custom:ha-log-email', title: 'Log Email Summary', email_recipient: 'demo@example.com' });
  card.hass = hass;
  setTimeout(() => {
    const tab = params.get('tab') || 'schedule';
    const button = card.shadowRoot?.querySelector('.tab-btn[data-tab="' + tab + '"]');
    button?.click();
  }, 600);
  const scrub = () => {
    if (!card.shadowRoot) return;
    card.shadowRoot.querySelectorAll('#tip-banner, .donate-section, [class*="support"]').forEach(n => n.remove());
    if (!card.shadowRoot.getElementById('harness-hacard-fix')) {
      const style = document.createElement('style');
      style.id = 'harness-hacard-fix';
      style.textContent = 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; }';
      card.shadowRoot.appendChild(style);
    }
  };
  setInterval(scrub, 150);
  setTimeout(() => { scrub(); document.title = 'READY'; }, 1500);
})();
</script>
</body>
</html>
